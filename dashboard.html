
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatApp Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-page">

<div class="app-shell">

    <!-- 1. USERS SIDEBAR -->
    <aside class="sidebar">

        <div class="sidebar-brand">
            <h2>ChatApp</h2>
        </div>

        <h4>USERS</h4>

        <div id="users-list" class="users-list">
            Loading users...
        </div>

        <div class="sidebar-footer">
            <div class="avatar" id="my-avatar">?</div>

            <div class="my-details">
                <strong id="my-name">My Account</strong>
                <small>Online</small>
            </div>

            <button id="logout-btn">Logout</button>
        </div>

    </aside>


    <!-- MAIN CHAT WINDOW -->
    <main class="chat-area">

        <!-- 9. CURRENT USER NAME -->
        <header class="topbar">
            <div>
                <small>MY ACCOUNT</small>
                <strong id="current-user-name">Loading...</strong>
            </div>

            <span class="online-label">
                ● Online
            </span>
        </header>


        <!-- EMPTY SCREEN -->
        <section id="empty-state" class="empty-state">
            <h2>Welcome to ChatApp!</h2>
            <p>Select a friend from the users list to start chatting.</p>
        </section>


        <!-- CHAT SECTION -->
        <section id="chat-panel" class="chat-panel hidden">

            <!-- 6 & 7. FRIEND NAME AND STATUS -->
            <div class="chat-header">

                <div class="avatar" id="friend-avatar">?</div>

                <div>
                    <h3 id="friend-name">Friend Name</h3>

                    <small id="friend-status">
                        Offline
                    </small>
                </div>

            </div>


            <!-- 8. MAIN MESSAGE WINDOW -->
            <div id="chat-box" class="chat-box">
            </div>


            <!-- 2 & 3. MESSAGE INPUT AND SEND BUTTON -->
            <form id="chat-form" class="composer">

                <input
                    type="text"
                    id="message-input"
                    placeholder="Type your message..."
                    autocomplete="off"
                    required
                >

                <button type="submit" id="send-btn">
                    ➤
                </button>

            </form>

        </section>

    </main>

</div>

<script type="module" src="dashboard.js"></script>

</body>
</html>
